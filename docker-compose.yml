services:
  autenticacao-service:
    image: guilhermejr/sistema-autenticacao-service
    container_name: autenticacao-service
    restart: always
    env_file: /home/guilhermejr/secrets/autenticacao-service.env
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 768m
    environment:
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=50 -XX:+ExitOnOutOfMemoryError
    ports:
      - "127.0.0.1:9002:9002"

networks:
  default:
    external: true
    name: rede